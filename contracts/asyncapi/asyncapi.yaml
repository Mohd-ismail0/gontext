asyncapi: 3.0.0
info:
  title: Context Fabric Events
  version: 1.0.0
  description: |
    AsyncAPI contract for Context Fabric v1.

    **Public channels (integrator-facing):**
    - HTTP intake is documented in OpenAPI (`POST .../context/intake` and
      `.../intake:batch`). This document describes the CloudEvents payload shape
      for those public intake messages and the signed lifecycle notification
      payloads delivered via gateway-owned webhooks / cursor feed hydration hints.

    **Internal-only channels (not a public data plane):**
    - `context.work.v1`, `context.derived.v1`, `context.audit.v1`, and
      `context.dlq.v1` are implementation details for workers and operators.
      They MUST NOT be exposed to tenants, connectors, or MCP clients in v1
      (ADR 0010 / ADR 0012). Public change delivery is gateway-owned only
      (cursor feed + signed webhooks; metadata only).

    Never put document bodies, raw PII, credentials, bearer tokens, or secret
    source URLs on any bus payload.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

defaultContentType: application/json

servers:
  publicHttpIntake:
    host: "{gatewayHost}"
    protocol: https
    description: Public gateway HTTP intake (see OpenAPI). Not a raw NATS endpoint.
    variables:
      gatewayHost:
        default: context.example.com
  internalNats:
    host: "{natsHost}"
    protocol: nats
    description: Internal JetStream only. Private network; never public.
    variables:
      natsHost:
        default: nats.internal

channels:
  public.intake.single:
    address: /v1/organizations/{orgId}/context/intake
    description: Public single CloudEvents intake over HTTPS (OpenAPI canonical).
    parameters:
      orgId:
        description: Organization ID; must match token and source registration.
    messages:
      ingestRequest:
        $ref: "#/components/messages/IngestRequest"

  public.intake.batch:
    address: /v1/organizations/{orgId}/context/intake:batch
    description: Public batch CloudEvents intake over HTTPS.
    parameters:
      orgId:
        description: Organization ID
    messages:
      ingestBatch:
        $ref: "#/components/messages/IngestBatch"

  public.lifecycle.notifications:
    address: public/lifecycle/notifications
    description: |
      Signed lifecycle notification payloads for webhook push and the semantic
      equivalent of cursor-feed items. Metadata only — opaque IDs, revision/state,
      schema/profile versions, cursor. Consumers hydrate via authorized REST/MCP.
    messages:
      changeEvent:
        $ref: "#/components/messages/ChangeEventNotification"

  internal.lifecycle.v1:
    address: context.lifecycle.v1
    description: INTERNAL-ONLY durable lifecycle stream (JetStream). Not for tenants.
    servers:
      - $ref: "#/servers/internalNats"
    messages:
      lifecycleInternal:
        $ref: "#/components/messages/InternalLifecycleEvent"

  internal.work.v1:
    address: context.work.v1
    description: INTERNAL-ONLY work queue (parse/project/index). Not public.
    servers:
      - $ref: "#/servers/internalNats"
    messages:
      workCommand:
        $ref: "#/components/messages/InternalWorkCommand"

  internal.derived.v1:
    address: context.derived.v1
    description: INTERNAL-ONLY derived projection signals. Rebuildable; not authoritative.
    servers:
      - $ref: "#/servers/internalNats"
    messages:
      derivedSignal:
        $ref: "#/components/messages/InternalDerivedSignal"

  internal.audit.v1:
    address: context.audit.v1
    description: INTERNAL-ONLY audit fan-out. Redacted metadata only.
    servers:
      - $ref: "#/servers/internalNats"
    messages:
      auditEvent:
        $ref: "#/components/messages/InternalAuditEvent"

  internal.dlq.v1:
    address: context.dlq.v1
    description: INTERNAL-ONLY dead-letter queue for failed processing/delivery.
    servers:
      - $ref: "#/servers/internalNats"
    messages:
      dlqRecord:
        $ref: "#/components/messages/InternalDlqRecord"

operations:
  receivePublicIntake:
    action: receive
    channel:
      $ref: "#/channels/public.intake.single"
    summary: Gateway receives a source-bound CloudEvent
    messages:
      - $ref: "#/channels/public.intake.single/messages/ingestRequest"

  receivePublicIntakeBatch:
    action: receive
    channel:
      $ref: "#/channels/public.intake.batch"
    summary: Gateway receives a batch of CloudEvents
    messages:
      - $ref: "#/channels/public.intake.batch/messages/ingestBatch"

  sendLifecycleNotification:
    action: send
    channel:
      $ref: "#/channels/public.lifecycle.notifications"
    summary: Gateway sends signed metadata-only lifecycle notifications
    messages:
      - $ref: "#/channels/public.lifecycle.notifications/messages/changeEvent"

  publishInternalLifecycle:
    action: send
    channel:
      $ref: "#/channels/internal.lifecycle.v1"
    summary: INTERNAL — outbox relay publishes lifecycle facts
    messages:
      - $ref: "#/channels/internal.lifecycle.v1/messages/lifecycleInternal"

  publishInternalWork:
    action: send
    channel:
      $ref: "#/channels/internal.work.v1"
    summary: INTERNAL — enqueue projection/parser work
    messages:
      - $ref: "#/channels/internal.work.v1/messages/workCommand"

  publishInternalDerived:
    action: send
    channel:
      $ref: "#/channels/internal.derived.v1"
    summary: INTERNAL — derived projection signals
    messages:
      - $ref: "#/channels/internal.derived.v1/messages/derivedSignal"

  publishInternalAudit:
    action: send
    channel:
      $ref: "#/channels/internal.audit.v1"
    summary: INTERNAL — audit fan-out
    messages:
      - $ref: "#/channels/internal.audit.v1/messages/auditEvent"

  publishInternalDlq:
    action: send
    channel:
      $ref: "#/channels/internal.dlq.v1"
    summary: INTERNAL — dead letter
    messages:
      - $ref: "#/channels/internal.dlq.v1/messages/dlqRecord"

components:
  messages:
    IngestRequest:
      name: IngestRequest
      title: Public intake CloudEvent
      contentType: application/cloudevents+json
      payload:
        $ref: "#/components/schemas/CloudEventEnvelope"
      headers:
        type: object
        properties:
          X-Context-Fabric-Signature:
            type: string
          X-Context-Fabric-Key-Id:
            type: string
          X-Context-Fabric-Timestamp:
            type: string
          Idempotency-Key:
            type: string

    IngestBatch:
      name: IngestBatch
      title: Public intake CloudEvents batch
      contentType: application/cloudevents-batch+json
      payload:
        type: array
        minItems: 1
        maxItems: 1000
        items:
          $ref: "#/components/schemas/CloudEventEnvelope"

    ChangeEventNotification:
      name: ChangeEventNotification
      title: Public lifecycle change notification
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ChangeEvent"
      headers:
        type: object
        properties:
          X-Context-Fabric-Webhook-Signature:
            type: string
          X-Context-Fabric-Webhook-Key-Id:
            type: string
          X-Context-Fabric-Webhook-Timestamp:
            type: string
          X-Context-Fabric-Event-Id:
            type: string

    InternalLifecycleEvent:
      name: InternalLifecycleEvent
      title: Internal lifecycle (not public)
      payload:
        $ref: "#/components/schemas/InternalEnvelope"

    InternalWorkCommand:
      name: InternalWorkCommand
      title: Internal work command (not public)
      payload:
        $ref: "#/components/schemas/InternalEnvelope"

    InternalDerivedSignal:
      name: InternalDerivedSignal
      title: Internal derived signal (not public)
      payload:
        $ref: "#/components/schemas/InternalEnvelope"

    InternalAuditEvent:
      name: InternalAuditEvent
      title: Internal audit event (not public)
      payload:
        $ref: "#/components/schemas/InternalEnvelope"

    InternalDlqRecord:
      name: InternalDlqRecord
      title: Internal DLQ record (not public)
      payload:
        $ref: "#/components/schemas/InternalDlq"

  schemas:
    CloudEventEnvelope:
      type: object
      description: Aligns with contracts/jsonschema/event-envelope.json
      required: [specversion, id, source, type, time, datacontenttype, data]
      additionalProperties: true
      properties:
        specversion:
          type: string
          const: "1.0"
        id:
          type: string
        source:
          type: string
        type:
          type: string
          pattern: "^com\\.contextfabric\\.ingest\\.[a-z0-9_.]+\\.v[0-9]+$"
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        organizationid:
          type: string
        contextspaceid:
          type: string
        resourceid:
          type: string
        revisionid:
          type: string
        data:
          type: object
          description: Metadata and locators only; no document bodies.

    ChangeEvent:
      type: object
      description: Aligns with contracts/jsonschema/change-event.json
      additionalProperties: false
      required:
        - event_id
        - organization_id
        - cursor
        - occurred_at
        - change_type
        - resource_id
        - revision_id
        - lifecycle_state
        - schema_version
        - profile_version
      properties:
        event_id: { type: string }
        organization_id: { type: string }
        cursor:
          type: string
          description: Monotonic org-scoped cursor; no global order.
        occurred_at: { type: string, format: date-time }
        change_type:
          type: string
          enum:
            - resource.accepted
            - resource.indexed
            - resource.reclassified
            - resource.tombstoned
            - resource.purged
            - resource.failed
        context_space_id: { type: string }
        resource_id: { type: string }
        revision_id: { type: string }
        lifecycle_state:
          type: string
          enum:
            - ACCEPTED
            - PROJECTING
            - INDEXED
            - FAILED
            - RECLASSIFIED
            - TOMBSTONED
            - PURGE_PENDING
            - PURGED
        schema_version: { type: string }
        profile_version: { type: string }
        brand_id:
          type: ["string", "null"]
        source_id:
          type: ["string", "null"]

    InternalEnvelope:
      type: object
      description: |
        INTERNAL-ONLY. Stable event_id + org/resource keys + schema refs.
        Bodies and secrets forbidden.
      required: [event_id, organization_id, type, observed_at]
      additionalProperties: false
      properties:
        event_id: { type: string }
        organization_id: { type: string }
        type: { type: string }
        resource_id: { type: string }
        revision_id: { type: string }
        observed_at: { type: string, format: date-time }
        schema_id: { type: string }
        schema_version: { type: string }
        causation_id: { type: string }
        correlation_id: { type: string }
        attributes:
          type: object
          additionalProperties:
            type: ["string", "number", "boolean", "null"]

    InternalDlq:
      type: object
      additionalProperties: false
      required: [event_id, organization_id, failed_at, reason_code, source_channel]
      properties:
        event_id: { type: string }
        organization_id: { type: string }
        failed_at: { type: string, format: date-time }
        reason_code: { type: string }
        source_channel:
          type: string
          enum:
            - context.lifecycle.v1
            - context.work.v1
            - context.derived.v1
            - context.audit.v1
            - public.webhook.delivery
        attempt: { type: integer, minimum: 1 }
        last_error: { type: string }
        replayable: { type: boolean }
