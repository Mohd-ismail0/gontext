name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          mkdir -p tmp
          go test -count=1 -o tmp/ ./...
      - name: Build binaries
        run: |
          go build -o bin/context-fabric ./cmd/context-fabric
          go build -o bin/cf ./cmd/cf
      - name: Validate OpenAPI contract
        run: test -s contracts/openapi/openapi.yaml
      - name: Validate OpenFGA model JSON
        run: |
          test -s contracts/openfga/model.json
          python3 -c "import json; m=json.load(open('contracts/openfga/model.json')); assert m.get('schema_version'); assert m.get('type_definitions')"
      - name: Validate JSON Schema contracts
        run: |
          test -s contracts/jsonschema/context-packet.json
          test -s contracts/jsonschema/export-manifest.json
          test -s contracts/jsonschema/event-envelope.json
      - name: Compile retrieval eval scorer
        run: go build -o bin/retrieval-score ./eval/retrieval
      - name: Migration embed parity
        run: diff -qr migrations internal/migrate/migrations
      - name: Validate migration 008 present
        run: test -s migrations/008_outbox_claim_and_org_revoke.sql
      - name: Docker build
        run: docker build -t context-fabric:ci .
