name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on: $unformatted"
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Build binaries
        run: |
          go build -o bin/context-fabric ./cmd/context-fabric
          go build -o bin/cf ./cmd/cf
      - name: Compile retrieval eval scorer
        run: go build -o bin/retrieval-score ./eval/retrieval

  contracts:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate contracts and profiles
        run: bash scripts/validate-contracts.sh
      - name: Validate migration head present
        run: test -s migrations/009_legal_holds.sql

  security:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck
        run: govulncheck ./...

  build:
    runs-on: ubuntu-latest
    needs: [unit, contracts]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Docker build
        run: docker build -t ghcr.io/mohd-ismail0/gontext:ci .
