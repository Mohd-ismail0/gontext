name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          mkdir -p tmp
          go test -count=1 -o tmp/ ./...
      - name: Build binaries
        run: |
          go build -o bin/context-fabric ./cmd/context-fabric
          go build -o bin/cf ./cmd/cf

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t context-fabric:ci .
