{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "context-fabric.fullname" . }}-serve
  labels:
    {{- include "context-fabric.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "context-fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: serve
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.serve.service.port }}
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "context-fabric.fullname" . }}-worker
  labels:
    {{- include "context-fabric.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "context-fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - {}
{{- end }}
