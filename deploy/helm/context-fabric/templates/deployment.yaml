{{- if .Values.serve.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "context-fabric.fullname" . }}-serve
  labels:
    {{- include "context-fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  replicas: {{ .Values.serve.replicaCount }}
  selector:
    matchLabels:
      {{- include "context-fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: serve
  template:
    metadata:
      labels:
        {{- include "context-fabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: serve
    spec:
      serviceAccountName: {{ include "context-fabric.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: serve
          image: {{ include "context-fabric.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["{{ .Values.serve.role | default "all" }}"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONTEXT_FABRIC_ROLE
              value: {{ .Values.serve.role | default "all" | quote }}
            {{- include "context-fabric.env" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/context-fabric
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: {{ .Values.serve.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.serve.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.serve.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.serve.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.serve.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.serve.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.serve.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.serve.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.serve.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.serve.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "context-fabric.fullname" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "context-fabric.fullname" . }}-worker
  labels:
    {{- include "context-fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "context-fabric.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "context-fabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "context-fabric.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "context-fabric.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CONTEXT_FABRIC_ROLE
              value: worker
            {{- include "context-fabric.env" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/context-fabric
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["/usr/local/bin/context-fabric", "doctor"]
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "context-fabric.fullname" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
