{{- if .Values.serve.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "context-fabric.fullname" . }}-serve
  labels:
    {{- include "context-fabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: serve
spec:
  type: {{ .Values.serve.service.type }}
  selector:
    {{- include "context-fabric.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: serve
  ports:
    - name: http
      port: {{ .Values.serve.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
