# Dex OIDC test IdP overlay for integration CI.
# Merges with starter stack; point OIDC_* env vars at dex in .env.starter for CI.
#
# Serve is attached to starter's internal `data` network. Docker's embedded DNS
# then SERVFAILs lookups for `dex` ("server misbehaving"). Pin dex in serve's
# /etc/hosts to the host gateway and publish Dex on :5556 so JWKS is reachable.

services:
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    networks:
      - gateway
    ports:
      - "5556:5556"

  serve:
    extra_hosts:
      - "dex:host-gateway"
    environment:
      OIDC_ISSUER: http://dex:5556/dex
      OIDC_AUDIENCE: context-fabric-starter
      OIDC_CLIENT_ID: context-fabric-starter
      OIDC_CLIENT_SECRET: integration-dex-secret
      OIDC_DISCOVERY_URL: http://dex:5556/dex/.well-known/openid-configuration
      OIDC_JWKS_URL: http://dex:5556/dex/keys
    ports:
      - "8080:8080"
    depends_on:
      dex:
        condition: service_started
