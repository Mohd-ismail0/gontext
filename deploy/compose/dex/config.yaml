issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
  passwordConnector: local
  grantTypes:
    - authorization_code
    - refresh_token
    - password
staticClients:
  - id: context-fabric-starter
    secret: integration-dex-secret
    name: Context Fabric Starter
    public: false
    redirectURIs:
      - http://localhost/callback
enablePasswordDB: true
staticPasswords:
  - email: alice@example.com
    # bcrypt hash of "password" (Dex example config-dev.yaml)
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiVbs7aKXvYJk6MKdi"
    username: alice
    userID: alice
    groups:
      - admins
