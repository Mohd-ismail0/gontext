    # bcrypt hash of "password" (Dex example)
    hash: $2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiVbs7aKXvYJk6MKdi
    username: alice
    userID: alice
    groups:
      - admins
