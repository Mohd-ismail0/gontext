# Minimal one-command demo: bundled postgres/minio/nats/openfga + single context-fabric process (role: all).
# Usage from repo root:
#   cp deploy/compose/.env.example deploy/compose/.env
#   docker compose -f deploy/compose/docker-compose.minimal.yaml --env-file deploy/compose/.env up --build

name: context-fabric-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-context_fabric}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-admin}
    volumes:
      - demo_postgres:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [demo]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    expose: ["5432"]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change-me-minio-secret}
    volumes:
      - demo_minio:/data
    networks: [demo]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose: ["9000"]

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID:-minioadmin}" "$${S3_SECRET_ACCESS_KEY:-change-me-minio-secret}"
        for b in context-raw context-derived context-quarantine; do
          mc mb --ignore-existing "local/$${b}"
          mc version enable "local/$${b}"
        done
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio-secret}
    networks: [demo]
    restart: "no"

  nats:
    image: nats:2.10.24-alpine
    command: ["--js", "--sd=/data", "--http_port=8222"]
    volumes:
      - demo_nats:/data
    networks: [demo]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose: ["4222", "8222"]

  openfga-migrate:
    image: openfga/openfga:v1.8.4
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-postgres-admin}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [demo]
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.4
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-postgres-admin}@postgres:5432/openfga?sslmode=disable
      OPENFGA_HTTP_ADDR: 0.0.0.0:8080
      OPENFGA_GRPC_ADDR: 0.0.0.0:8081
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    networks: [demo]
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=0.0.0.0:8081"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose: ["8080", "8081"]

  migrate:
    image: ${CONTEXT_FABRIC_IMAGE:-ghcr.io/xsama/context-fabric:1.0.0}
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      CONTEXT_FABRIC_ROLE: migrate
      CONTEXT_FABRIC_PROFILE: demo
      POSTGRES_DSN: postgres://${POSTGRES_GATEWAY_USER:-context_gateway}:${POSTGRES_GATEWAY_PASSWORD:-change-me-postgres-gateway}@postgres:5432/${POSTGRES_DB:-context_fabric}?sslmode=disable
      POSTGRES_ADMIN_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-postgres-admin}@postgres:5432/${POSTGRES_DB:-context_fabric}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [demo]
    restart: "no"

  context-fabric:
    image: ${CONTEXT_FABRIC_IMAGE:-ghcr.io/xsama/context-fabric:1.0.0}
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["all"]
    environment:
      CONTEXT_FABRIC_ROLE: all
      CONTEXT_FABRIC_PROFILE: demo
      CONTEXT_FABRIC_LISTEN_ADDR: ":8080"
      POSTGRES_DSN: postgres://${POSTGRES_GATEWAY_USER:-context_gateway}:${POSTGRES_GATEWAY_PASSWORD:-change-me-postgres-gateway}@postgres:5432/${POSTGRES_DB:-context_fabric}?sslmode=disable
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-minio-secret}
      S3_BUCKET_RAW: context-raw
      S3_BUCKET_DERIVED: context-derived
      S3_BUCKET_QUARANTINE: context-quarantine
      NATS_URL: nats://nats:4222
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-change-me-openfga-token}
      OPENFGA_STORE_ID: ${OPENFGA_STORE_ID:-replace-after-bootstrap}
      OPENFGA_MODEL_ID: demo-model-v1
      OIDC_ISSUER: ${OIDC_ISSUER:-http://oidc:8080/}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-context-fabric}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-context-fabric-demo}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-change-me-oidc-client-secret}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      openfga:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks: [demo]
    ports:
      - "${SERVE_PUBLIC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

networks:
  demo:
    name: context-fabric-demo

volumes:
  demo_postgres:
  demo_minio:
  demo_nats:
